<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresina ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Sfondo rosaceo sfumato */
            background: linear-gradient(180deg, #ffe4e9 0%, #ffccd5 100%);
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
        }

        /* Scheda principale per Smartphone */
        .card {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 420px;
            border-radius: 25px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(255, 154, 162, 0.3);
            text-align: center;
            margin-top: 10px;
        }

        /* Spazio riservato per la foto in alto */
        .photo-space {
            width: 100%;
            max-height: 250px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .photo-space img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* Domanda Principale */
        h1.question {
            color: #ff4d6d;
            font-size: 1.5em;
            line-height: 1.4;
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Contenitore per i due pulsanti Si / No */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .btn-choice {
            flex: 1;
            padding: 14px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-yes {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 12px rgba(255, 77, 109, 0.4);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background-color: #c8d6e5;
            color: #576574;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Messaggio simpatico se si clicca "No" */
        #no-warning {
            display: none;
            color: #ff4757;
            font-weight: bold;
            font-size: 0.95em;
            margin-top: 10px;
        }

        /* Sezione Sorpresa Nascosta (Si attiva cliccando "Si") */
        #surprise-content {
            display: none;
            margin-top: 20px;
            border-top: 2px dashed #ffb3c1;
            padding-top: 20px;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Box Contatore */
        .counter-box {
            background-color: #fff0f3;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }

        .counter-box p {
            font-size: 0.85em;
            text-transform: uppercase;
            color: #ff4d6d;
            font-weight: bold;
        }

        .counter-box h2 {
            font-size: 1.6em;
            color: #c9184a;
        }

        /* Lettera / Dedica */
        .letter {
            text-align: left;
            font-size: 0.95em;
            line-height: 1.6;
            color: #444;
            background: #fff9fa;
            padding: 18px;
            border-radius: 15px;
            border-left: 4px solid #ff4d6d;
        }

        footer {
            margin-top: 25px;
            font-size: 0.85em;
            color: #a4b0be;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- SPAZIO FOTO IN ALTO (Se la foto si chiama foto.jpg) -->
        <div class="photo-space">
            <img src="foto.jpg" alt="La nostra foto" onerror="this.style.display='none'; this.parentElement.innerText='[Spazio riservato per la tua foto ❤️]';">
        </div>

        <!-- DOMANDA PRINCIPALE -->
        <h1 class="question">Bimba sei pronta per vedere la tua sorpresina?</h1>

        <!-- CASALLE / PULSANTI SI E NO -->
        <div class="btn-group">
            <button class="btn-choice btn-yes" onclick="showSurprise()">Sì ❤️</button>
            <button class="btn-choice btn-no" onclick="clickNo()">No 😜</button>
        </div>

        <p id="no-warning">Risposta sbagliata! Devi per forza cliccare "Sì"! 😉</p>

        <!-- CONTENUTO DELLA SORPRESA (Apare dopo il "Sì") -->
        <div id="surprise-content">
            
            <div class="counter-box">
                <p>Insieme da</p>
                <h2 id="days-counter">...</h2>
            </div>

            <div class="letter">
                <p>
                    Sei la persona più speciale che io potessi mai incontrare. Ho creato questo piccolo sito solo per te, per ricordarti quanto ti amo ogni singolo giorno! ❤️
                </p>
            </div>

        </div>

    </div>

    <footer>
        Fatto con tanto amore ❤️
    </footer>

    <script>
        // CONFIGURA QUI LA VOSTRA DATA DI FIDANZAMENTO (Anno, Mese-1, Giorno)
        // Es. 15 Maggio 2023 -> new Date(2023, 4, 15)
        const startDate = new Date(2023, 0, 1); 

        function calculateDays() {
            const today = new Date();
            const timeDiff = today - startDate;
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            document.getElementById('days-counter').innerText = days + " Giorni";
        }

        function showSurprise() {
            document.getElementById('surprise-content').style.display = 'block';
            document.getElementById('no-warning').style.display = 'none';
            calculateDays();
        }

        function clickNo() {
            document.getElementById('no-warning').style.display = 'block';
        }
    </script>
</body>
</html>

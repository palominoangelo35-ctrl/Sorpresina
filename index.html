<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Per Te ❤️</title>
    <style>
        /* Stili grafici del sito */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5; /* Sfondo rosa tenue */
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #ff6b81;
            color: white;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5em;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .photo-frame {
            margin: 20px 0;
        }

        .photo-frame img {
            width: 100%;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        p.lettera {
            font-size: 1.2em;
            line-height: 1.8;
            color: #555;
            text-align: justify;
            padding: 0 20px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>Per Te, [Nome della tua ragazza] ❤️</h1>
        <p>Un piccolo spazio dedicato a noi</p>
    </header>

    <div class="container">
        <h2>Un pensiero speciale</h2>
        
        <!-- Sostituisci "foto.jpg" con il nome della tua immagine -->
        <div class="photo-frame">
            <img src="foto.jpg" alt="Noi insieme">
        </div>

        <h3>La mia lettera per te</h3>
        <p class="lettera">
            Scrivi qui il tuo messaggio speciale per lei. Puoi raccontare come vi siete conosciuti, 
            cosa ami di lei o semplicemente fare degli auguri speciali...
        </p>
    </div>

    <footer>
        <p>Fatto con ❤️ da [Il tuo nome]</p>
    </footer>

</body>
</html>
